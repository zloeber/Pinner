name: ci

on:
  push:
    branches: [main, "feature/**", "chore/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mise toolchain
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Validate repository configs
        run: task validate:configs

      - name: Format check
        run: task fmt:check

      - name: Clippy
        run: task clippy

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mise toolchain
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Unit and integration tests
        run: task test

      - name: Provider fixture pin/upgrade validation
        run: task validate:providers

      - name: Lock schema fixtures
        run: task test:schema

      - name: Installer dry-run smoke
        run: PINNER_INSTALL_DRY_RUN=1 PINNER_VERSION=0.1.0 bash scripts/install.sh

  # Aggregate gate so branch protection can require a single check name.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: All CI jobs passed
        run: echo "lint + test ok"
