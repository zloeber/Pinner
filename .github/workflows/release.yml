name: release

# Tag-driven semantic releases: push (or semantic-release creates) a git tag
# matching vMAJOR.MINOR.PATCH (e.g. v0.2.0). The release job rewrites
# Cargo.toml workspace version from the tag before building so the CLI and
# package metadata match without a manual pre-bump.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version from tag or Cargo.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml | head -1)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            echo "::notice::Tag-first release: $tag → version $version (Cargo.toml was $cargo_version)"
          else
            version="$cargo_version"
            tag="v${version}"
            echo "::notice::workflow_dispatch dry-run using Cargo.toml version $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $version (tag $tag)"

  build:
    name: build (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          # macos-13 was retired Dec 2025; jobs using it queue forever.
          # macos-15-intel is GitHub's last hosted x86_64 macOS image.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Align Cargo.toml workspace version with release tag
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          # Rewrite only the workspace.package version line.
          python3 - "$version" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("Cargo.toml")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(?ms)(^\[workspace\.package\].*?^version\s*=\s*)\"[^\"]*\"",
          )
          new_text, n = pattern.subn(rf'\1"{version}"', text, count=1)
          if n != 1:
              raise SystemExit("failed to rewrite [workspace.package].version in Cargo.toml")
          path.write_text(new_text, encoding="utf-8")
          print(f"Set [workspace.package].version = \"{version}\"")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tag-first releases rewrite [workspace.package].version in Cargo.toml.
      # Path packages in Cargo.lock still carry the old version, so --locked
      # fails until we refresh workspace members (deps stay pinned).
      - name: Sync Cargo.lock with rewritten workspace versions
        shell: bash
        run: |
          set -euo pipefail
          cargo update -w

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p pinner --target ${{ matrix.target }}

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          target="${{ matrix.target }}"
          bin_name="pinner"
          ext=""
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            ext=".exe"
          fi
          src="target/${target}/release/${bin_name}${ext}"
          stage="dist/${bin_name}-${version}-${target}"
          mkdir -p "$stage"
          cp "$src" "$stage/"
          cp README.md "$stage/"
          if [[ -f LICENSE ]]; then
            cp LICENSE "$stage/"
          fi
          mkdir -p dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            asset="${bin_name}-${version}-${target}.zip"
            # windows-latest has no Info-ZIP `zip`; 7-Zip is preinstalled.
            (cd dist && 7z a -tzip "$asset" "$(basename "$stage")")
          else
            asset="${bin_name}-${version}-${target}.tar.gz"
            tar -C dist -czf "dist/${asset}" "$(basename "$stage")"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          ls -la "dist/${asset}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: pinner-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish-release
    needs: [meta, build]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Pinner ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
