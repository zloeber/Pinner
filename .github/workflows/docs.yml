name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book.toml"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "book.toml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Install from GitHub release binaries (avoids peaceiris/actions-mdbook Node 20).
      - name: Install mdBook
        run: |
          set -euo pipefail
          version="0.4.52"
          archive="mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${version}/${archive}" \
            | tar -xz
          sudo install -m 755 mdbook /usr/local/bin/mdbook
          mdbook --version

      - name: Sync README into docs src
        run: cp README.md docs/README.md

      - name: Build book
        run: mdbook build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    name: deploy-pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
