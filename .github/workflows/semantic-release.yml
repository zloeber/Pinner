name: Semantic Release
run-name: Semantic Release - ${{ github.ref_name }}

# Conventional commits on main → annotated tag vX.Y.Z (PAT required so the
# tag push can trigger release.yml). Does not create a GitHub Release; that
# is owned by release.yml.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  semantic-release:
    name: Generate Semantic Release Tag
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      # Checkout with the job token. Do NOT pass PAT_TOKEN here — an invalid or
      # empty PAT makes actions/checkout fail with a cryptic git auth error.
      # persist-credentials: false so GITHUB_TOKEN is not left in
      # http.*.extraheader (that header beats URL-embedded PAT credentials and
      # would make the tag push look like GITHUB_TOKEN → release.yml never runs).
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require PAT_TOKEN
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT_TOKEN:-}" ]]; then
            echo "::error::PAT_TOKEN is missing or empty. Seed a classic PAT (contents:write) via Secretfile.yml — secretzero agent sync --web"
            exit 2
          fi

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get previous tag
        id: prev_tag
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV_TAG"

      - name: Parse commits and determine version bump
        id: version
        run: |
          set -euo pipefail
          PREV_TAG="${{ steps.prev_tag.outputs.tag }}"
          PREV_VERSION="${PREV_TAG#v}"

          if git rev-parse "$PREV_TAG" >/dev/null 2>&1 && [[ "$PREV_TAG" != "v0.0.0" ]]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:%s)
          else
            COMMITS=$(git log --pretty=format:%s)
          fi

          echo "Commits since last release:"
          echo "$COMMITS"

          MAJOR_BUMP=0
          MINOR_BUMP=0
          PATCH_BUMP=0

          if echo "$COMMITS" | grep -qE 'BREAKING CHANGE|^feat!:'; then
            MAJOR_BUMP=1
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            MINOR_BUMP=1
          elif echo "$COMMITS" | grep -qE '^(fix|refactor|perf)(\(.+\))?:'; then
            PATCH_BUMP=1
          fi

          if [[ "$MAJOR_BUMP" -eq 0 && "$MINOR_BUMP" -eq 0 && "$PATCH_BUMP" -eq 0 ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "new_version=" >> "$GITHUB_OUTPUT"
            echo "No releasable conventional commits (feat/fix/refactor/perf/BREAKING); skipping tag."
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$PREV_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if [[ "$MAJOR_BUMP" -eq 1 ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "$MINOR_BUMP" -eq 1 ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Check if tag already exists
        id: check_tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.new_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: >-
          steps.version.outputs.should_release == 'true' &&
          steps.check_tag.outputs.tag_exists == 'false'
        uses: dtolnay/rust-toolchain@stable

      # Keep [workspace.package].version + Cargo.lock aligned with the release
      # tag so `task install` / `cargo install --path` report the real version
      # (cargo metadata uses Cargo.toml, not git describe).
      - name: Bump workspace version for release
        if: >-
          steps.version.outputs.should_release == 'true' &&
          steps.check_tag.outputs.tag_exists == 'false'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("Cargo.toml")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(?ms)(^\[workspace\.package\].*?^version\s*=\s*)\"[^\"]*\"",
          )
          new_text, n = pattern.subn(rf'\1"{version}"', text, count=1)
          if n != 1:
              raise SystemExit("failed to rewrite [workspace.package].version in Cargo.toml")
          path.write_text(new_text, encoding="utf-8")
          print(f"Set [workspace.package].version = \"{version}\"")
          PY
          cargo update -w

      # PAT is required so the commit/tag push can trigger release.yml
      # (GITHUB_TOKEN pushes do not chain workflows by default). Also clear
      # leftover checkout auth so the PAT in the push URL is what GitHub sees.
      # chore(release) commit does not match feat/fix/… so a follow-up
      # semantic-release run after the push will no-op.
      - name: Commit version bump, create and push tag
        if: >-
          steps.version.outputs.should_release == 'true' &&
          steps.check_tag.outputs.tag_exists == 'false'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          TAG="v${VERSION}"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): ${TAG}"
          git tag -a "$TAG" -m "Release $TAG"
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          remote="https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git -c "http.https://github.com/.extraheader=" push "$remote" HEAD:main; then
            echo "::error::Failed to push release commit with PAT_TOKEN. Re-seed a valid classic PAT (contents:write) via secretzero agent sync --web."
            exit 1
          fi
          if ! git -c "http.https://github.com/.extraheader=" push "$remote" "refs/tags/${TAG}"; then
            echo "::error::Failed to push tag with PAT_TOKEN. Re-seed a valid classic PAT (contents:write) via secretzero agent sync --web — expired/revoked/wrong-scope tokens fail here."
            exit 1
          fi
          echo "Committed version bump and pushed tag: $TAG"

      - name: Log output
        run: |
          echo "Previous tag: ${{ steps.prev_tag.outputs.tag }}"
          echo "Should release: ${{ steps.version.outputs.should_release }}"
          echo "New version: ${{ steps.version.outputs.new_version }}"
          echo "Tag exists: ${{ steps.check_tag.outputs.tag_exists }}"
