[book]
title = "Pinner"
description = "Pin floating dependency versions across tools and infrastructure-as-code"
authors = ["Pinner contributors"]
language = "en"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/zloeber/Pinner"
edit-url-template = "https://github.com/zloeber/Pinner/edit/main/docs/{path}"
site-url = "/Pinner/"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/pinner.css"]
additional-js = ["theme/pinner.js"]
