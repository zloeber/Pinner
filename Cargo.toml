[workspace]
resolver = "2"
members = [
  "crates/pinner",
  "crates/pinner-core",
  "crates/pinner-ecosystem",
  "crates/pinner-toolchain",
  "crates/pinner-mise",
  "crates/pinner-node",
  "crates/pinner-python",
  "crates/pinner-docker",
  "crates/pinner-actions",
  "crates/pinner-iac-common",
  "crates/pinner-terraform",
  "crates/pinner-helm",
  "crates/pinner-k8s",
  "crates/pinner-cargo",
  "crates/pinner-go",
  "crates/pinner-ruby",
  "crates/pinner-gitlab",
  "crates/pinner-azure",
  "crates/pinner-ui",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zloeber/Pinner"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
serde_yaml = "0.9"
walkdir = "2"
globset = "0.4"
ignore = "0.4"
rayon = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
jsonschema = { version = "0.49", default-features = false }
pinner-core = { path = "crates/pinner-core" }
pinner-ecosystem = { path = "crates/pinner-ecosystem" }
pinner-toolchain = { path = "crates/pinner-toolchain" }
pinner-mise = { path = "crates/pinner-mise" }
pinner-node = { path = "crates/pinner-node" }
pinner-python = { path = "crates/pinner-python" }
pinner-docker = { path = "crates/pinner-docker" }
pinner-actions = { path = "crates/pinner-actions" }
hcl-edit = "0.9"
pinner-iac-common = { path = "crates/pinner-iac-common" }
pinner-terraform = { path = "crates/pinner-terraform" }
pinner-helm = { path = "crates/pinner-helm" }
pinner-k8s = { path = "crates/pinner-k8s" }
pinner-cargo = { path = "crates/pinner-cargo" }
pinner-go = { path = "crates/pinner-go" }
pinner-ruby = { path = "crates/pinner-ruby" }
pinner-gitlab = { path = "crates/pinner-gitlab" }
pinner-azure = { path = "crates/pinner-azure" }
pinner-ui = { path = "crates/pinner-ui" }
ratatui = "0.30"
crossterm = "0.29"
