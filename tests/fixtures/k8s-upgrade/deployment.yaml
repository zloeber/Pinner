apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        - name: init
          image: busybox:1.36
      containers:
        - name: nginx
          image: nginx:latest
        - name: sidecar
          image: alpine
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  key: value
