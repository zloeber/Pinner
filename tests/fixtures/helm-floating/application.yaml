  name: argo-cd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: "~2.4.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
