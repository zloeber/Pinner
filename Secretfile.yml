# yaml-language-server: $schema=https://github.com/zloeber/SecretZero/raw/refs/heads/main/Secretfile.schema.json
# Seed PAT_TOKEN into GitHub Actions via SecretZero (never commit secret values).
# Example: secretzero agent sync --web   or   secretzero web
variables:
  github_org: zloeber
  github_repo: Pinner

providers:
  github:
    kind: github
    auth:
      kind: token
      config:
        token: ${GITHUB_TOKEN}

secrets:
  # Classic PAT with contents:write so semantic-release can push tags that
  # trigger the release workflow (GITHUB_TOKEN often cannot chain workflows).
  - name: release_token
    kind: static
    config:
      default: ${PAT_TOKEN}
    targets:
      - provider: github
        kind: github_secret
        config:
          owner: ${github_org}
          repo: ${github_repo}
          secret_name: PAT_TOKEN
    agent_instructions:
      summary: "Seed a GitHub PAT for automated semantic-release tagging"
      steps:
        - action: "Create a classic Personal Access Token with contents:write on zloeber/Pinner"
          description: "Settings → Developer settings → Personal access tokens"
        - action: "Sync via SecretZero web or agent sync (do not paste the token into chat)"
          description: "Maps to Actions secret PAT_TOKEN used by semantic-release.yml"
